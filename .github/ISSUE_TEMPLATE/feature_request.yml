name: Feature request
description: 提議範圍明確的新功能或改善
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解決的問題
      description: 請說明使用情境與目前限制。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建議方案
      description: 說明預期行為，以及是否會改變架構、安全邊界或部署流程。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考慮過的替代方案
      description: 選填。請列出較簡單的 workaround 或其他設計。

  - type: checkboxes
    id: scope
    attributes:
      label: 提交前確認
      options:
        - label: 內容不含 secret、個資或可識別部署的值。
          required: true
